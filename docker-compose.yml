services:
  mcxor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcxor-pwa
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # Example custom domain: SITE_ADDRESS=mc.example.com
      # Example no-domain nip.io: SITE_ADDRESS=203.0.113.10.nip.io
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      - TLS_DIRECTIVE=${TLS_DIRECTIVE:-}
      - ACME_EMAIL_DIRECTIVE=${ACME_EMAIL_DIRECTIVE:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
